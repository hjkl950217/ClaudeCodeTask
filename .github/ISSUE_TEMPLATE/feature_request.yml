name: 功能请求
description: 为 cct 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你想解决什么问题、期望的解决方案，方便我评估实现方式。
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题？*
      description: 描述你的使用场景、痛点或现有流程中的不足
      placeholder: "当 ... 的时候，我希望 ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 *
      description: 描述你期望的功能或行为
      placeholder: "希望新增 ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式或临时变通手段（可为空）
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue / Discussions，未找到相同建议
          required: true
