name: 发布到 PowerShell Gallery

on:
  release:
    types: [created]

jobs:
  publish:
    name: 发布 cct
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 release tag 更新模块版本号
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "tag 格式应为 v0.1.0，当前: $tag"
            exit 1
          }
          Update-ModuleManifest -Path 'ClaudeCodeTask.UI/ClaudeCodeTask.UI.psd1' -ModuleVersion $version
          Write-Output "模块版本号已更新为 $version"

      - name: 发布到 PowerShell Gallery
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Publish-Module -Path 'ClaudeCodeTask.UI' -NuGetApiKey $env:PS_GALLERY_KEY -Verbose
