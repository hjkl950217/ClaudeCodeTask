name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 发布门禁：测试不通过则不发版。分支逻辑与 ci.yml 保持一致（RealData 依赖真实本机数据，排除）
  test:
    name: Pester 测试
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 信任 PSGallery 并安装 Pester 6
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 6.0.0 -Force
      - name: 设置时区为东八区（测试断言基于 UTC+8 本地时间）
        run: Set-TimeZone -Id 'China Standard Time'
      - name: 运行测试
        run: |
          # GitHub Actions 的 pwsh 默认 $ErrorActionPreference='stop'，与本机开发环境(Continue)不一致，
          # 会让依赖 Write-Error 不终止的既有测试失败，显式恢复为 Continue
          $ErrorActionPreference = 'Continue'
          $tests = @(Get-ChildItem -Path 'tests' -Filter '*.Tests.ps1' -File | Where-Object { $_.Name -ne 'RealData.Tests.ps1' })
          $result = Invoke-Pester -Path $tests.FullName -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.TotalCount -eq 0) { exit 1 }

  # 发布到 PowerShell Gallery（tag 即版本，只做机械改写与上传，不含任何内容生成）
  publish-gallery:
    name: 发布到 PowerShell Gallery
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 从 release tag 更新模块版本号
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "tag 格式应为 v0.1.0，当前: $tag"
            exit 1
          }
          Update-ModuleManifest -Path 'ClaudeCodeTask.UI/ClaudeCodeTask.psd1' -ModuleVersion $version
          Write-Output "模块版本号已更新为 $version"
      - name: Publish-Module
        env:
          PS_GALLERY_KEY: ${{ secrets.PS_GALLERY_KEY }}
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # staging 法：PowerShellGet 2.x 传目录要求「目录名 = psd1 文件名」，仓库目录仍叫 ClaudeCodeTask.UI，
          # 故先拷到临时目录 ClaudeCodeTask/（目录名 = 模块名）再发布；lib/ 内嵌内核 dll 随拷，保证安装后
          # Add-Type 从 $PSScriptRoot\lib 加载，不依赖仓库相对路径。
          $stage = Join-Path $env:RUNNER_TEMP 'cct_stage'
          New-Item -ItemType Directory -Force (Join-Path $stage 'ClaudeCodeTask') | Out-Null
          Copy-Item -Path 'ClaudeCodeTask.UI/*' -Destination (Join-Path $stage 'ClaudeCodeTask') -Recurse
          Publish-Module -Path (Join-Path $stage 'ClaudeCodeTask') -NuGetApiKey $env:PS_GALLERY_KEY

  # 创建 GitHub Release：标题 = tag（v0.2.0）；正文 = release-notes/<tag>.md 文档内容；
  # 附 ClaudeCodeTask.zip 模块包（含 psm1/psd1/ps1/lib，解压到 PowerShell Modules 即可手动安装）；
  # Source code 源码包由 GitHub 对 tag 自动生成。文案先进仓库、随 tag 一起被 checkout，此处只读粘贴与机械打包。
  create-release:
    name: 创建 GitHub Release
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 从 release tag 更新模块版本号（zip 内 psd1 与 tag 保持一致）
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "tag 格式应为 v0.1.0，当前: $tag"
            exit 1
          }
          Update-ModuleManifest -Path 'ClaudeCodeTask.UI/ClaudeCodeTask.psd1' -ModuleVersion $version
          Write-Output "模块版本号已更新为 $version"
      - name: 打包模块 zip
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'cct_asset'
          $zip = Join-Path $env:RUNNER_TEMP 'ClaudeCodeTask.zip'
          New-Item -ItemType Directory -Force (Join-Path $stage 'ClaudeCodeTask') | Out-Null
          Copy-Item -Path 'ClaudeCodeTask.UI/*' -Destination (Join-Path $stage 'ClaudeCodeTask') -Recurse
          Compress-Archive -Path (Join-Path $stage 'ClaudeCodeTask') -DestinationPath $zip -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$zip"
      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
